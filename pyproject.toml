[project]
name = "pdf-utilities"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
chapterize = "chapterize.cli:main"
pdf-splitter = "pdf_splitter.cli:main"
pdf-text-exporter = "pdf_text_exporter.cli:main"
pdf-page-replacer = "pdf_page_replacer.cli:main"

[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"
