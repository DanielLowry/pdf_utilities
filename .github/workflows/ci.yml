name: chapterize CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          pip install uv
      - name: Install dependencies with uv
        run: |
          uv venv
          uv pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest
